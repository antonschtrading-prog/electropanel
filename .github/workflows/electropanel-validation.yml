name: Electropanel validation
on:
  pull_request:
    paths:
      - 'app.js'
      - 'catalog.js'
      - 'protection.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/electropanel-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check catalog.js
          node --check protection.js
      - name: Run regression tests
        run: node --test tests/*.test.js
