name: Electropanel validation
on:
  pull_request:
    paths:
      - 'app.js'
      - 'catalog.js'
      - 'protection.js'
      - 'overload-v30.js'
      - 'tt-screen-v45.js'
      - 'cable-evidence-v45.js'
      - 'cable-tables-v31.js'
      - 'reference-ampacity-v38.js'
      - 'reference-cable-v39.js'
      - 'typical-lv-v43.js'
      - 'route-impedance-v44.js'
      - 'layout-v414.js'
      - 'legacy-compat.js'
      - 'wiring-audit-v18.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/electropanel-validation.yml'
      - 'scripts/build-site.js'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check catalog.js
          node --check protection.js
          node --check overload-v30.js
          node --check tt-screen-v45.js
          node --check cable-evidence-v45.js
          node --check cable-tables-v31.js
          node --check reference-ampacity-v38.js
          node --check reference-cable-v39.js
          node --check typical-lv-v43.js
          node --check route-impedance-v44.js
          node --check layout-v414.js
          node --check legacy-compat.js
          node --check wiring-audit-v18.js
          node --check scripts/build-site.js
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Verify exact GitHub Pages package
        run: |
          node scripts/build-site.js
          test -s dist/index.html
          test -s dist/app.js
      - name: Package browser smoke-test fixture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: electropanel-web-preview
          retention-days: 1
          path: dist/
