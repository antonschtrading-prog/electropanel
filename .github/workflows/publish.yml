name: Verify and publish Electropanel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static app and run regression suite
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s catalog.js
          for file in protection.js overload-v30.js tt-screen-v45.js cable-evidence-v45.js cable-tables-v31.js reference-ampacity-v38.js reference-cable-v39.js typical-lv-v43.js route-impedance-v44.js layout-v414.js legacy-compat.js; do test -s "$file"; done
          node --check catalog.js
          node --check app.js
          node --check protection.js
          node --check overload-v30.js
          node --check tt-screen-v45.js
          node --check cable-evidence-v45.js
          node --check cable-tables-v31.js
          node --check reference-ampacity-v38.js
          node --check reference-cable-v39.js
          node --check typical-lv-v43.js
          node --check route-impedance-v44.js
          node --check layout-v414.js
          node --check legacy-compat.js
          node --test tests/*.test.js
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js catalog.js browser_check.html dist/
          # Every local JS file actually referenced by index.html must ship to Pages.
          # The source-file syntax is deliberately restricted to root-relative safe names.
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/<script\\s+src="([^"]+)"/g)].map(m=>m[1]);
          if(refs.length<2)throw Error('Expected local script references');
          for(const name of refs){
            if(!/^[A-Za-z0-9_.-]+\\.js$/.test(name))throw Error('Unsafe/non-local script path: '+name);
            if(!fs.existsSync(name)||!fs.statSync(name).size)throw Error('Missing script: '+name);
            fs.copyFileSync(name,'dist/'+name);
          }
          console.log('Packaged',refs.length,'local JavaScript assets.');
          NODE
          printf '' > dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
