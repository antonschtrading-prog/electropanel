name: Verify and publish Electropanel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static app and run regression suite
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s catalog.js
          for file in protection.js overload-v30.js tt-screen-v45.js cable-evidence-v45.js layout-v414.js legacy-compat.js; do test -s "$file"; done
          node --check catalog.js
          node --check app.js
          node --check protection.js
          node --check overload-v30.js
          node --check tt-screen-v45.js
          node --check cable-evidence-v45.js
          node --check layout-v414.js
          node --check legacy-compat.js
          node --test tests/*.test.js
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js catalog.js protection.js overload-v30.js tt-screen-v45.js layout-v414.js legacy-compat.js browser_check.html dist/
          for file in catalog.js overload-v30.js tt-screen-v45.js protection.js layout-v414.js legacy-compat.js app.js; do grep -q 'src="'$file'"' index.html || exit 1; done
          printf '' > dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
