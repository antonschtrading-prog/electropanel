name: Electropanel browser integration
on:
  pull_request:
  push:
    branches: [feature/design-evidence-integrated-20261114]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Package and exercise actual page
        run: |
          node scripts/build-site.js
          node scripts/browser-integration.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-integration
          path: browser-integration.png
          if-no-files-found: ignore
