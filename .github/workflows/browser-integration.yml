name: Electropanel browser integration
on:
  pull_request:
  push:
    branches: [feature/design-evidence-integrated-20261114]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and run all Node regression tests
        run: |
          set -euo pipefail
          node --check app.js
          node --check cabinet-apparatus-evidence-v1.js
          node --check cabinet-missing-geometry-csv-v1.js
          node --test tests/*.test.js
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-ubuntu-24.04-chromium
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Package and exercise actual page
        run: |
          node scripts/build-site.js
          node scripts/browser-integration.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-integration
          path: browser-*.png
          if-no-files-found: ignore
